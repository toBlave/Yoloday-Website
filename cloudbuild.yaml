# Cloud Build config for yolo.day.
# Static site (public/) — no compile step, just deploy to Firebase Hosting.
#
# Requires the Cloud Build service account to have the "Firebase Hosting Admin"
# role (roles/firebasehosting.admin) on the "yoloday" GCP project. Firebase CLI
# authenticates automatically using that service account's credentials when run
# inside Cloud Build — no FIREBASE_TOKEN needed.
#
# (retrigger: verifying Cloud Build trigger fires on push)
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting:yoloday-public --project yoloday --non-interactive

timeout: 600s
